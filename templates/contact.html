<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Contact</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #eaeaea;
    }

    /* Grille cyber en fond */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(180, 0, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 0, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(180,0,255,0.12) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      padding: 20px;
    }

    /* Badge terminal */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 28px;
    }

    .badge span { color: #e879f9; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    h1 .white { color: #ffffff; }
    h1 .gradient {
      background: linear-gradient(90deg, #e879f9, #818cf8, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e879f9;
      font-style: italic;
      margin-bottom: 36px;
      letter-spacing: 1px;
    }

    .subtitle::after {
      content: '█';
      animation: blink 1s step-end infinite;
      color: #22d3ee;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* Card formulaire */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(180, 0, 255, 0.2);
      border-radius: 16px;
      padding: 36px;
      box-shadow:
        0 0 40px rgba(180, 0, 255, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #818cf8;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      color: #eaeaea;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #e879f9;
      box-shadow: 0 0 16px rgba(232, 121, 249, 0.15);
    }

    textarea { resize: vertical; min-height: 120px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 24px rgba(232, 121, 249, 0.3);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(232, 121, 249, 0.5);
    }

    .btn:active { transform: translateY(0); }

    /* Liens sociaux */
    .socials {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      justify-content: center;
    }

    .socials a {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0aec0;
      text-decoration: none;
      font-size: 1rem;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }

    .socials a:hover {
      border-color: #e879f9;
      color: #e879f9;
      box-shadow: 0 0 12px rgba(232, 121, 249, 0.3);
    }

    /* Toast confirmation */
    .toast {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 8px;
      color: #22d3ee;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="badge">🖥 <span>>_</span> Accès autorisé. Bienvenue sur la page contact d'Ashley Edoh, visiteur.</div>

    <h1>
      <span class="white">Me</span><br>
      <span class="gradient">Contacter</span>
    </h1>
    <p class="subtitle">Envoyez un message sécurisé</p>

    <div class="card">
      <div class="row">
        <div class="field">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="John" />
        </div>
        <div class="field">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Doe" />
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@example.com" />
      </div>

      <div class="field">
        <label>Message</label>
        <textarea id="message" placeholder="Votre message..."></textarea>
      </div>

      <button class="btn" onclick="handleSubmit()">ENVOYER LE MESSAGE</button>
      <div class="toast" id="toast">✔ Message transmis avec succès.</div>
    </div>

    <div class="socials">
      <a href="#" title="GitHub">⌥</a>
      <a href="#" title="LinkedIn">in</a>
      <a href="#" title="Shield">⊕</a>
    </div>

  </div>

  <script>
    function handleSubmit() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
