<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Contact</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 40px 20px;
      color: #eaeaea;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(180, 0, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 0, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(180,0,255,0.12) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 28px;
    }

    .badge span { color: #e879f9; }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    h1 .white { color: #ffffff; }
    h1 .gradient {
      background: linear-gradient(90deg, #e879f9, #818cf8, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e879f9;
      font-style: italic;
      margin-bottom: 36px;
      letter-spacing: 1px;
    }

    .subtitle::after {
      content: '█';
      animation: blink 1s step-end infinite;
      color: #22d3ee;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(180, 0, 255, 0.2);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 0 40px rgba(180, 0, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.75rem;
      color: #818cf8;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 12px 16px;
      color: #eaeaea;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #e879f9;
      box-shadow: 0 0 16px rgba(232, 121, 249, 0.15);
    }

    textarea { resize: vertical; min-height: 120px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 24px rgba(232, 121, 249, 0.3);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(232, 121, 249, 0.5);
    }

    .btn:active { transform: translateY(0); }

    .socials {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      justify-content: center;
    }

    .socials a {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0aec0;
      text-decoration: none;
      font-size: 1rem;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }

    .socials a:hover {
      border-color: #e879f9;
      color: #e879f9;
      box-shadow: 0 0 12px rgba(232, 121, 249, 0.3);
    }

    /* Popup overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .overlay.active { display: flex; }

    .popup {
      background: #0f0f1a;
      border: 1px solid rgba(232, 121, 249, 0.4);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 60px rgba(232, 121, 249, 0.2);
      max-width: 360px;
      width: 90%;
    }

    .popup .icon { font-size: 2.5rem; margin-bottom: 16px; }

    .popup h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #e879f9;
      margin-bottom: 10px;
    }

    .popup p {
      color: #a0aec0;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .popup .close-btn {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">🖥 <span>>_</span> Accès autorisé. Bienvenue sur la page d'Ashley Edoh </div>

    <h1>
      <span class="white">Me</span><br>
      <span class="gradient">Contacter</span>
    </h1>
    <p class="subtitle">Envoyez un message sécurisé</p>

    <div class="card">
      <div class="row">
        <div class="field">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="John" />
        </div>
        <div class="field">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Doe" />
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@example.com" />
      </div>

      <div class="field">
        <label>Message</label>
        <textarea id="message" placeholder="Votre message..."></textarea>
      </div>

      <button class="btn" onclick="handleSubmit()">⟢ ENVOYER LE MESSAGE</button>
    </div>

    <div class="socials" :class="{ visible: show.socials }">
          <a
            v-for="s in socials"
            :key="s.label"
            :href="s.url"
            target="_blank"
            rel="noopener"
            class="social-btn"
            :title="s.label"
          >
            <span class="social-icon" v-html="s.svg"></span>
          </a>
        </div>

  <!-- Popup -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <h2>MESSAGE TRANSMIS</h2>
      <p>Votre message a bien été envoyé.<br>Je vous répondrai dans les plus brefs délais.</p>
      <button class="close-btn" onclick="closePopup()">FERMER</button>
    </div>
  </div>

  <script>
    function handleSubmit() {
      document.getElementById('overlay').classList.add('active');
    }
    function closePopup() {
      document.getElementById('overlay').classList.remove('active');
    }
  </script>
</body>
</html>
